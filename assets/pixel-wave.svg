<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%" height="100">
  <defs>
    <style>
      @keyframes waveAnim {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100px); }
      }
      @keyframes waveAnim2 {
        0% { transform: translateX(0); }
        100% { transform: translateX(100px); }
      }
      .wave1 { animation: waveAnim 3s ease-in-out infinite alternate; }
      .wave2 { animation: waveAnim2 2.5s ease-in-out infinite alternate; }
      .wave3 { animation: waveAnim 4s ease-in-out infinite alternate; }
    </style>
  </defs>
  
  <rect width="800" height="100" fill="#0a0e27"/>
  
  <!-- Pixel Waves -->
  <g class="wave1" fill="#004466" opacity="0.5">
    <rect x="0" y="70" width="20" height="10"/>
