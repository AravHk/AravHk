<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="400">
  <defs>
    <style>
      @keyframes wave1 {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100px); }
      }
      @keyframes wave2 {
        0% { transform: translateX(0); }
        100% { transform: translateX(100px); }
      }
      @keyframes lightning {
        0%, 90%, 96%, 100% { opacity: 0; }
        92%, 94% { opacity: 1; }
      }
      @keyframes flash {
        0%, 89%, 95%, 100% { opacity: 0.3; }
        91%, 93% { opacity: 1; }
      }
      @keyframes cloudMove {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50px); }
      }
      .pixel { shape-rendering: crispEdges; }
      .wave-layer { animation: wave1 4s ease-in-out infinite alternate; }
      .wave-layer2 { animation: wave2 3s ease-in-out infinite alternate; }
      .lightning { animation: lightning 6s infinite; }
      .flash { animation: flash 6s infinite; }
      .cloud { animation: cloudMove 20s linear infinite; }
    </style>
  </defs>
  
  <!-- Sky Background -->
  <rect width="800" height="400" fill="#0a0e27"/>
  
  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <rect x="50" y="30" width="2" height="2"/>
    <rect x="120" y="60" width="2" height="2"/>
    <rect x="200" y="20" width="2" height="2"/>
    <rect x="300" y="45" width="2" height="2"/>
    <rect x="450" y="25" width="2" height="2"/>
    <rect x="550" y="55" width="2" height="2"/>
    <rect x="650" y="35" width="2" height="2"/>
    <rect x="700" y="70" width="2" height="2"/>
    <rect x="380" y="15" width="2" height="2"/>
    <rect x="160" y="80" width="2" height="2"/>
  </g>
  
  <!-- Moon -->
  <rect x="650" y="30" width="30" height="30" rx="15" fill="#f0e68c" opacity="0.8"/>
  <rect x="660" y="35" width="15" height="20" rx="7" fill="#0a0e27"/>
  
  <!-- Clouds -->
  <g class="cloud" opacity="0.3">
    <rect x="100" y="80" width="60" height="20" fill="#1a1f4e" rx="3"/>
    <rect x="120" y="70" width="40" height="15" fill="#1a1f4e" rx="3"/>
    <rect x="500" y="90" width="80" height="20" fill="#1a1f4e" rx="3"/>
    <rect x="520" y="78" width="50" height="18" fill="#1a1f4e" rx="3"/>
  </g>
  
  <!-- Lightning Flash Overlay -->
  <rect class="flash" width="800" height="400" fill="#b0e0ff"/>
  
  <!-- Lightning Bolt -->
  <g class="lightning">
    <polygon points="350,50 360,120 330,130 370,200 340,210 390,280 360,290 410,370" 
             fill="#ffff00" opacity="0.9"/>
    <polygon points="350,50 360,120 330,130 370,200 340,210 390,280 360,290 410,370" 
             fill="#ffffff" opacity="0.5" stroke="#ffff00" stroke-width="2"/>
    <!-- Branches -->
    <line x1="370" y1="200" x2="420" y2="240" stroke="#ffff00" stroke-width="3"/>
    <line x1="360" y1="120" x2="310" y2="160" stroke="#ffff00" stroke-width="3"/>
  </g>
  
  <!-- Pixel Wave - Layer 1 (Background) -->
  <g class="wave-layer" fill="#004466" opacity="0.6">
    <rect x="0" y="280" width="20" height="20"/>
    <rect x="20" y="270" width="20" height="30"/>
    <rect x="40" y="260" width="20" height="40"/>
    <rect x="60" y="250" width="20" height="50"/>
    <rect x="80" y="260" width="20" height="40"/>
    <rect x="100" y="270" width="20" height="30"/>
    <rect x="120" y="280" width="20" height="20"/>
    <rect x="140" y="260" width="20" height="40"/>
    <rect x="160" y="250" width="20" height="50"/>
    <rect x="180" y="240" width="20" height="60"/>
    <rect x="200" y="250" width="20" height="50"/>
    <rect x="220" y="260" width="20" height="40"/>
    <rect x="240" y="270" width="20" height="30"/>
    <rect x="260" y="280" width="20" height="20"/>
    <rect x="280" y="265" width="20" height="35"/>
    <rect x="300" y="255" width="20" height="45"/>
    <rect x="320" y="245" width="20" height="55"/>
    <rect x="340" y="255" width="20" height="45"/>
    <rect x="360" y="265" width="20" height="35"/>
    <rect x="380" y="275" width="20" height="25"/>
    <rect x="400" y="285" width="20" height="15"/>
  </g>
  
  <!-- Pixel Wave - Layer 2 -->
  <g class="wave-layer2" fill="#0066aa" opacity="0.8">
    <rect x="50" y="290" width="20" height="15"/>
    <rect x="70" y="280" width="20" height="25"/>
    <rect x="90" y="270" width="20" height="35"/>
    <rect x="110" y="265" width="20" height="40"/>
    <rect x="130" y="275" width="20" height="30"/>
    <rect x="150" y="285" width="20" height="20"/>
    <rect x="170" y="275" width="20" height="30"/>
    <rect x="190" y="265" width="20" height="40"/>
    <rect x="210" y="260" width="20" height="45"/>
    <rect x="230" y="265" width="20" height="40"/>
    <rect x="250" y="275" width="20" height="30"/>
    <rect x="270" y="285" width="20" height="20"/>
    <rect x="290" y="275" width="20" height="30"/>
    <rect x="310" y="265" width="20" height="40"/>
    <rect x="330" y="260" width="20" height="45"/>
    <rect x="350" y="265" width="20" height="40"/>
    <rect x="370" y="275" width="20" height="30"/>
    <rect x="390" y="285" width="20" height="20"/>
    <rect x="410" y="275" width="20" height="30"/>
    <rect x="430" y="265" width="20" height="40"/>
    <rect x="450" y="260" width="20" height="45"/>
  </g>
  
  <!-- Pixel Wave - Layer 3 (Front) -->
  <g class="wave-layer" fill="#0099cc" opacity="0.9">
    <rect x="100" y="300" width="20" height="15"/>
    <rect x="120" y="290" width="20" height="25"/>
    <rect x="140" y="285" width="20" height="30"/>
    <rect x="160" y="280" width="20" height="35"/>
    <rect x="180" y="285" width="20" height="30"/>
    <rect x="200" y="290" width="20" height="25"/>
    <rect x="220" y="295" width="20" height="20"/>
    <rect x="240" y="285" width="20" height="30"/>
    <rect x="260" y="280" width="20" height="35"/>
    <rect x="280" y="275" width="20" height="40"/>
    <rect x="300" y="280" width="20" height="35"/>
    <rect x="320" y="285" width="20" height="30"/>
    <rect x="340" y="290" width="20" height="25"/>
    <rect x="360" y="295" width="20" height="20"/>
    <rect x="380" y="285" width="20" height="30"/>
    <rect x="400" y="280" width="20" height="35"/>
    <rect x="420" y="275" width="20" height="40"/>
    <rect x="440" y="280" width="20" height="35"/>
    <rect x="460" y="285" width="20" height="30"/>
    <rect x="480" y="290" width="20" height="25"/>
  </g>
  
  <!-- Splash/Spray -->
  <g fill="#b0e0ff" opacity="0.7">
    <rect x="180" y="230" width="10" height="10"/>
    <rect x="190" y="220" width="10" height="10"/>
    <rect x="200" y="235" width="10" height="10"/>
    <rect x="210" y="225" width="10" height="10"/>
    <rect x="220" y="240" width="10" height="10"/>
    <rect x="280" y="235" width="10" height="10"/>
    <rect x="290" y="225" width="10" height="10"/>
    <rect x="300" y="230" width="10" height="10"/>
    <rect x="310" y="220" width="10" height="10"/>
    <rect x="320" y="240" width="10" height="10"/>
  </g>
  
  <!-- Shore/Beach -->
  <g fill="#1a1f4e">
    <rect x="0" y="320" width="800" height="80"/>
    <rect x="0" y="310" width="20" height="10" fill="#002244"/>
    <rect x="40" y="315" width="20" height="5" fill="#002244"/>
    <rect x="80" y="312" width="20" height="8" fill="#002244"/>
    <rect x="120" y="318" width="20" height="2" fill="#002244"/>
    <rect x="160" y="313" width="20" height="7" fill="#002244"/>
    <rect x="200" y="316" width="20" height="4" fill="#002244"/>
    <rect x="240" y="311" width="20" height="9" fill="#002244"/>
    <rect x="280" y="317" width="20" height="3" fill="#002244"/>
    <rect x="320" y="314" width="20" height="6" fill="#002244"/>
    <rect x="360" y="312" width="20" height="8" fill="#002244"/>
    <rect x="400" y="319" width="20" height="1" fill="#002244"/>
    <rect x="440" y="315" width="20" height="5" fill="#002244"/>
  </g>
  
  <!-- Foam on shore -->
  <g fill="#ffffff" opacity="0.3">
    <rect x="10" y="310" width="10" height="5"/>
    <rect x="50" y="312" width="15" height="3"/>
    <rect x="90" y="308" width="12" height="4"/>
    <rect x="130" y="314" width="10" height="2"/>
    <rect x="170" y="309" width="14" height="3"/>
    <rect x="210" y="311" width="11" height="4"/>
    <rect x="250" y="307" width="13" height="5"/>
    <rect x="290" y="313" width="10" height="3"/>
    <rect x="330" y="310" width="12" height="4"/>
    <rect x="370" y="308" width="14" height="3"/>
    <rect x="410" y="315" width="10" height="2"/>
    <rect x="450" y="311" width="13" height="4"/>
  </g>
</svg>
